<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saisie mensuelle — OCP Planification</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="dashboard-shell">
    <header class="topbar">
      <div class="topbar-brand-group">
        <img src="../assets/ocph.png" alt="OCP" class="topbar-logo">
        <div class="topbar-divider"></div>
        <span class="topbar-brand">Bureau Géologie — <strong>Planification</strong></span>
      </div>
      <div class="topbar-user">
        <div class="topbar-avatar" id="user-initials">—</div>
        <div class="topbar-user-info">
          <div class="topbar-user-name" id="user-name">—</div>
          <div class="topbar-user-role" id="user-role">—</div>
        </div>
        <button class="btn-logout" id="logout-btn">Déconnexion</button>
      </div>
    </header>

    <div class="dashboard-body">
      <nav class="sidebar">
        <div class="sidebar-section-label">Vue d'ensemble</div>
        <a href="dashboard.html" class="sidebar-nav-item">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Tableau de bord
        </a>
        <a href="gantt.html" class="sidebar-nav-item">
          <svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="14" y2="7"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="6" y1="17" x2="16" y2="17"/></svg>
          Planning Gantt
        </a>
        <div class="sidebar-section-label" data-roles="admin,contributeur">Données</div>
        <a href="programme.html" class="sidebar-nav-item" data-roles="admin">
          <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><line x1="4" y1="9" x2="20" y2="9"/></svg>
          Programme annuel
        </a>
        <a href="panneaux.html" class="sidebar-nav-item" data-roles="admin">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Panneaux
        </a>
        <a href="saisie-mensuelle.html" class="sidebar-nav-item active" data-roles="admin,contributeur">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          Saisie mensuelle
        </a>
        <div class="sidebar-section-label">Suivi</div>
        <a href="suivi-powerbi.html" class="sidebar-nav-item">
          <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Suivi (Power BI)
        </a>
      </nav>

      <main class="main-content">
        <div class="content-inner">
          <div class="page-head">
            <div>
              <h1 class="page-title">Saisie mensuelle</h1>
              <p class="page-subtitle">Renseigne les paramètres du mois. Les résultats sont calculés automatiquement.</p>
            </div>
          </div>

          <div id="alert-zone"></div>

          <section class="panel">
            <div class="panel-body">
              <div class="selector-row">
                <div class="field">
                  <label for="panneau-select">Panneau</label>
                  <select id="panneau-select">
                    <option value="" disabled selected>Sélectionner un panneau</option>
                  </select>
                </div>
                <div class="field">
                  <label for="mois">Mois</label>
                  <input type="month" id="mois" value="2026-01">
                </div>
              </div>
            </div>

            <div class="panel-body" style="border-top:1px solid var(--gray-200);">
              <form id="saisie-form" novalidate>
                <div class="form-grid">
                  <div class="field"><label for="cadence">Cadence</label><input type="number" id="cadence" name="cadence" step="0.01"></div>
                  <div class="field"><label for="rendement_d11">Rendement D11 (m³/h)</label><input type="number" id="rendement_d11" name="rendement_d11" step="0.01"></div>
                  <div class="field"><label for="rendement_foration">Rdt foration (ml/h)</label><input type="number" id="rendement_foration" name="rendement_foration" step="0.01"></div>
                  <div class="field"><label for="dosage_ammonix">Dosage Ammonix (g/m³)</label><input type="number" id="dosage_ammonix" name="dosage_ammonix" step="0.01"></div>
                  <div class="field"><label for="densite">Densité</label><input type="number" id="densite" name="densite" step="0.01"></div>
                </div>
                <div class="form-actions">
                  <button type="submit" class="btn-primary btn-compact" id="submit-btn" disabled>Calculer et enregistrer</button>
                </div>
              </form>
            </div>
          </section>

          <!-- Résultats calculés -->
          <section class="panel" id="resultats-panel" hidden>
            <div class="panel-head"><h2 class="panel-title">Résultats calculés</h2></div>
            <div class="panel-body">
              <div class="stats-grid" id="resultats-grid"></div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/saisie-mensuelle.js"></script>
</body>
</html>
