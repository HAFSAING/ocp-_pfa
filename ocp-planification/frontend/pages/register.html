<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte — OCP Planification</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="login-screen">

    <div class="login-form-side">
      <div class="login-box">

        <img src="../assets/ocph.png" alt="OCP" class="login-box-logo">

        <h1 class="login-title">Créer un compte</h1>

        <form id="register-form" novalidate>
          <div class="field">
            <label for="fullname">Nom complet</label>
            <input type="text" id="fullname" name="fullname" autocomplete="name" required>
            <div class="field-error" id="fullname-error" hidden></div>
          </div>

          <div class="field">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" autocomplete="username" required>
            <div class="field-error" id="email-error" hidden></div>
          </div>

          <div class="field">
            <label for="role">Rôle</label>
            <select id="role" name="role" required>
              <option value="" disabled selected>Sélectionner un rôle</option>
              <option value="admin">Planificateur (admin)</option>
              <option value="contributeur">Contributeur mensuel</option>
              <option value="viewer">Consultation seule</option>
            </select>
            <div class="field-error" id="role-error" hidden></div>
          </div>

          <div class="field">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required>
            <div class="field-error" id="password-error" hidden></div>
          </div>

          <div class="field">
            <label for="password-confirm">Confirmer le mot de passe</label>
            <input type="password" id="password-confirm" name="password-confirm" autocomplete="new-password" required>
            <div class="field-error" id="password-confirm-error" hidden></div>
          </div>

          <div class="field-error" id="form-error" hidden style="margin-bottom: 16px;"></div>

          <button type="submit" class="btn-primary" id="submit-btn">Créer mon compte</button>
        </form>

        <p class="login-signup-note">
          Déjà un compte ? <a href="login.html" class="login-link">Se connecter</a>
        </p>

      </div>
    </div>

    <div class="login-visual">
      <div class="strata-frame">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="100" height="10" fill="#0e3a26"/>
          <text x="3" y="6" font-family="IBM Plex Mono" font-size="1.6" fill="#7a9a8a" letter-spacing="0.1">RECOUVREMENT</text>
          <rect x="0" y="10" width="100" height="17" fill="#123f2c"/>
          <text x="3" y="20" font-family="IBM Plex Mono" font-size="1.8" fill="#7a9a8a" letter-spacing="0.1">TBT</text>
          <rect x="0" y="27" width="100" height="20" fill="#163e2c"/>
          <text x="3" y="39" font-family="IBM Plex Mono" font-size="1.8" fill="#7a9a8a" letter-spacing="0.1">BT</text>
          <rect x="0" y="47" width="100" height="15" fill="#1a4530"/>
          <text x="3" y="56" font-family="IBM Plex Mono" font-size="1.8" fill="#7a9a8a" letter-spacing="0.1">MT</text>
          <rect x="0" y="62" width="100" height="12" fill="#c68a3f"/>
          <rect x="0" y="62" width="100" height="0.6" fill="#e8c98a"/>
          <rect x="0" y="73.4" width="100" height="0.6" fill="#8a5f2b"/>
          <text x="3" y="70" font-family="IBM Plex Mono" font-size="2" font-weight="500" fill="#14181c" letter-spacing="0.1">PHOSPHATE</text>
          <rect x="0" y="74" width="100" height="26" fill="#071f15"/>
          <text x="3" y="90" font-family="IBM Plex Mono" font-size="1.6" fill="#4a6b5a">SUBSTRATUM</text>
          <line x1="88" y1="0" x2="88" y2="100" stroke="#aecc53" stroke-width="0.2" stroke-dasharray="0.6 1" opacity="0.6"/>
          <circle cx="88" cy="0" r="0.6" fill="#aecc53">
            <animate attributeName="cy" from="0" to="100" dur="5s" repeatCount="indefinite"/>
          </circle>
          <text x="90" y="11" font-family="IBM Plex Mono" font-size="1.3" fill="#4a6b5a">-12m</text>
          <text x="90" y="48" font-family="IBM Plex Mono" font-size="1.3" fill="#4a6b5a">-38m</text>
          <text x="90" y="75" font-family="IBM Plex Mono" font-size="1.3" fill="#4a6b5a">-51m</text>
        </svg>
      </div>
    </div>

  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
